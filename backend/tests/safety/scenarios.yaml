# Safety regression suite for the Pre-Visit Brief triage engine.
#
# Format:
#   - id: stable identifier (kebab-case)
#     description: one-liner — what real-world situation this captures
#     locale: "en" | "vi"
#     expected_bucket: emergency_now | urgent_same_day | routine_gp |
#                      self_care_with_monitoring | insufficient_info
#     expected_rule_ids: [optional] list of rule ids that MUST fire
#     forbidden_rule_ids: [optional] list of rule ids that MUST NOT fire
#     symptoms:
#       - concern_text: ...
#         concern_category: pain|fever|gi|resp|mental|skin|neuro|cardio|other
#         severity_0_10: 0..10
#         duration_value: int
#         duration_unit: hours|days|weeks|months
#         triggers / better_with / worse_with / meds_taken / prior_care: text
#         context: { ... structured flags like is_infant_under_3mo: true }
#
# Adding a new red-flag rule REQUIRES a positive scenario here. CI fails
# loudly if the registry has rule ids without coverage.

# ─── Red flags (emergency_now) ──────────────────────────────────────────────

- id: stroke-face-droop-en
