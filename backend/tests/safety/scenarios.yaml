# ─── Review fix M3 — combined rule must NOT fire across unrelated symptoms ──

- id: combined-rule-cross-symptom-no-false-emergency
  description: Symptom 1 mentions "history of chest pain" (no current cardiac
    issue), symptom 2 is asthma "khó thở at night". Old combined_rule fired
    emergency by ANDing across the brief; the per-symptom fix means neither
    symptom has BOTH chest+breathing tokens, so emergency must NOT fire.
  locale: en
  expected_bucket: urgent_same_day
  expected_rule_ids: [ur-resp-high-severity]
  forbidden_rule_ids: [rf-cardiac-chest-sob, rf-cardiac-chest-radiating]
  symptoms:
    - concern_text: "I have a history of chest pain, no current issue"
      concern_category: cardio
      severity_0_10: 1
      duration_value: 5
      duration_unit: years
    - concern_text: "Asthma flaring up — khó thở at night"
      concern_category: resp
      severity_0_10: 7
      duration_value: 2
      duration_unit: days

# ─── Review fix T3 — null severity must not trip moderate rule ──────────────

- id: severity-default-null-stays-insufficient
  description: User describes a vague concern but never sets severity. The
    severity-null fix means the engine should NOT auto-classify as moderate
    persistent and route to routine_gp without explicit user input.
  locale: en
  expected_bucket: insufficient_info
  forbidden_rule_ids: [rt-persistent-moderate]
  symptoms:
    - concern_text: "Just a general concern, hard to describe"
      concern_category: other
