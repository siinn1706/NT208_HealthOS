services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    # Pin to explicit release — avoid floating `latest`.
    # Verify / update tag at: https://hub.docker.com/r/minio/minio/tags
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 10s
      retries: 10

  minio-init:
    # Verify / update tag at: https://hub.docker.com/r/minio/mc/tags
    image: minio/mc:RELEASE.2025-04-18T07-47-37Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: /bin/sh
    command: -c "mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD}; mc mb --ignore-existing local/meals; mc mb --ignore-existing local/medical-docs"
    restart: "no"

  migrate:
    build:
      context: ../../backend
      dockerfile: Dockerfile
      target: prod
    env_file:
      - ../../backend/.env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-http://minio:9000}
      STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER}
      STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      DEBUG: "false"
      BFF_SHARED_SECRET: ${BFF_SHARED_SECRET:?BFF_SHARED_SECRET is required}
      METRICS_TOKEN: ${METRICS_TOKEN:?METRICS_TOKEN is required}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    command: python -m alembic upgrade head
    restart: "no"

  core-be:
    build:
      context: ../../backend
      dockerfile: Dockerfile
      target: prod
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ../../backend/.env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-http://minio:9000}
      STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER}
      STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      AI_WORKER_URL: http://ai-worker:8001
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/2
      DEBUG: "false"
      BFF_SHARED_SECRET: ${BFF_SHARED_SECRET:?BFF_SHARED_SECRET is required}
      METRICS_TOKEN: ${METRICS_TOKEN:?METRICS_TOKEN is required}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 10

  queue-worker:
    build:
      context: ../../backend
      dockerfile: Dockerfile
      target: prod
    restart: unless-stopped
    env_file:
      - ../../backend/.env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/2
      AI_WORKER_URL: http://ai-worker:8001
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-http://minio:9000}
      STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER}
      STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      DEBUG: "false"
      BFF_SHARED_SECRET: ${BFF_SHARED_SECRET:?BFF_SHARED_SECRET is required}
      METRICS_TOKEN: ${METRICS_TOKEN:?METRICS_TOKEN is required}
    depends_on:
      redis:
        condition: service_healthy
      core-be:
        condition: service_healthy
      ai-worker:
        condition: service_healthy
    command: celery -A app.tasks:celery_app worker --loglevel=info

  ai-worker:
    build:
      context: ../../services/ai-worker
      dockerfile: Dockerfile
      target: prod
    restart: unless-stopped
    ports:
      - "8001:8001"
    env_file:
      - ../../services/ai-worker/.env
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CORE_API_URL: http://core-be:8000
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-http://minio:9000}
      STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER}
      STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      DEBUG: "false"
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 10

  notification:
    build:
      context: ../../services/notification
      dockerfile: Dockerfile
      target: prod
    restart: unless-stopped
    ports:
      - "8002:8002"
    env_file:
      - ../../services/notification/.env
    environment:
      CORE_API_URL: http://core-be:8000
      DEBUG: "false"
    depends_on:
      core-be:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      target: prod
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ../../frontend/.env.local
    environment:
      CORE_API_URL: http://core-be:8000
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXT_PUBLIC_CORE_WS_URL: ${NEXT_PUBLIC_CORE_WS_URL}
      BFF_SHARED_SECRET: ${BFF_SHARED_SECRET:?BFF_SHARED_SECRET is required}
    depends_on:
      core-be:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  default:
    name: healthos_prod_net
