services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    # Pin to explicit release â€” avoid floating `latest`.
    # Verify / update tag at: https://hub.docker.com/r/minio/minio/tags
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 10s
      retries: 10

  minio-init:
    # Pin to explicit release — verify/update at: https://hub.docker.com/r/minio/mc/tags
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: /bin/sh
    command: -c "mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD}; mc mb --ignore-existing local/meals; mc mb --ignore-existing local/medical-docs"
    restart: "no"

  migrate:
    build:
      context: ../../backend
      dockerfile: Dockerfile
      target: prod
    env_file:
      - ../../backend/.env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER}
      STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      DEBUG: "false"
      BFF_SHARED_SECRET: ${BFF_SHARED_SECRET:?BFF_SHARED_SECRET is required}
      METRICS_TOKEN: ${METRICS_TOKEN:?METRICS_TOKEN is required}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    command: python -m alembic upgrade head
    restart: "no"

  core-be:
    build:
      context: ../../backend
      dockerfile: Dockerfile
      target: prod
    restart: unless-stopped
    env_file:
      - ../../backend/.env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER}
      STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      AI_WORKER_URL: http://ai-worker:8001
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/2
      DEBUG: "false"
      BFF_SHARED_SECRET: ${BFF_SHARED_SECRET:?BFF_SHARED_SECRET is required}
      METRICS_TOKEN: ${METRICS_TOKEN:?METRICS_TOKEN is required}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready').read()"]
      interval: 10s
      timeout: 5s
      retries: 10

  queue-worker:
    build:
      context: ../../backend
      dockerfile: Dockerfile
      target: prod
    restart: unless-stopped
    env_file:
      - ../../backend/.env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/2
      AI_WORKER_URL: http://ai-worker:8001
      AI_WORKER_TIMEOUT_SECONDS: "240"
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER}
      STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      DEBUG: "false"
      BFF_SHARED_SECRET: ${BFF_SHARED_SECRET:?BFF_SHARED_SECRET is required}
      METRICS_TOKEN: ${METRICS_TOKEN:?METRICS_TOKEN is required}
    depends_on:
      redis:
        condition: service_healthy
      core-be:
        condition: service_healthy
      ai-worker:
        condition: service_healthy
    command: celery -A app.tasks:celery_app worker --loglevel=info

  ai-worker:
    build:
      context: ../../services/ai-worker
      dockerfile: Dockerfile
      target: prod
    restart: unless-stopped
    env_file:
      - ../../services/ai-worker/.env
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CORE_API_URL: http://core-be:8000
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER}
      STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      AI_YOLO_MODEL_PATH: /app/models/yolov10/YOLOv10b_VietFood67_SGD_new_bigger.pt
      AI_CLASS_NAMES_PATH: /app/data/class_names.py
      AI_FOOD_ANALYSIS_ENABLED: "false"
      AI_CALORIECLIP_MODEL_PATH: /app/models/calorieclip
      AI_CALORIECLIP_TIMEOUT_SECONDS: "45"
      DEBUG: "false"
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 10

  notification:
    build:
      context: ../../services/notification
      dockerfile: Dockerfile
      target: prod
    restart: unless-stopped
    env_file:
      - ../../services/notification/.env
    environment:
      CORE_API_URL: http://core-be:8000
      DEBUG: "false"
    depends_on:
      core-be:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      target: prod
      args:
        APP_ENV: ${APP_ENV:-production}
        NEXT_PUBLIC_APP_ENV: ${NEXT_PUBLIC_APP_ENV:-prod}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://healthos.page}
        BFF_TRUSTED_ORIGINS: ${BFF_TRUSTED_ORIGINS:-https://healthos.page,https://www.healthos.page}
        BFF_CSRF_GUARD_MODE: ${BFF_CSRF_GUARD_MODE:-enforce}
        DEV_BYPASS_ENABLED: ${DEV_BYPASS_ENABLED:-false}
        DEV_BYPASS_CREDENTIALS: ${DEV_BYPASS_CREDENTIALS}
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ../../frontend/.env.local
    environment:
      APP_ENV: ${APP_ENV:-production}
      NEXT_PUBLIC_APP_ENV: ${NEXT_PUBLIC_APP_ENV:-prod}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://healthos.page}
      BFF_TRUSTED_ORIGINS: ${BFF_TRUSTED_ORIGINS:-https://healthos.page,https://www.healthos.page}
      BFF_CSRF_GUARD_MODE: ${BFF_CSRF_GUARD_MODE:-enforce}
      DEV_BYPASS_ENABLED: ${DEV_BYPASS_ENABLED:-false}
      DEV_BYPASS_CREDENTIALS: ${DEV_BYPASS_CREDENTIALS}
      CORE_API_URL: http://core-be:8000
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-${NEXT_PUBLIC_CORE_WS_URL}}
      NEXT_PUBLIC_CORE_WS_URL: ${NEXT_PUBLIC_CORE_WS_URL}  # DEPRECATED 2026-09-01
      BFF_SHARED_SECRET: ${BFF_SHARED_SECRET:?BFF_SHARED_SECRET is required}
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD is required}@redis:6379/0
    depends_on:
      core-be:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000',{signal:AbortSignal.timeout(4000)}).then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10

  # ── WS core-be smoke ───────────────────────────────────────────────────
  # One-shot smoke test that verifies Core WS endpoints are reachable and the
  # single-accept fix works.  Run manually via `run-ws-corebe-smoke.sh` or
  # during CI.  NOT started as part of the default compose up.
  # Uses pre-built python:3.12-slim image (no build: key) to avoid a broken-
  # build window when the compose file is used in CI (Red Team F15).
  ws-corebe-smoke:
    image: python:3.12-slim
    command: python /app/ws-corebe-smoke.py
    volumes:
      - ./ws-corebe-smoke:/app:ro
    profiles:
      - smoke
    depends_on:
      core-be:
        condition: service_healthy
    restart: "no"
    environment:
      - WS_SMOKE_TARGET=core-be:8000
      - WS_SMOKE_SECRET=${WS_SMOKE_SECRET}
    # env_file intentionally omitted — all vars passed explicitly above.

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  default:
    name: healthos_prod_net

