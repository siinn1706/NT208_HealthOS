x-logging: &default-logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  # ─── Databases & Brokers ──────────────────────────────────────────
  postgres:
    <<: *default-logging
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-healthos}
      POSTGRES_USER: ${POSTGRES_USER:-healthos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-healthos_dev_pass}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-healthos}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    <<: *default-logging
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-healthos_dev_pass}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-healthos_dev_pass}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    <<: *default-logging
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 10s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: /bin/sh
    command: -c "mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin}; mc mb --ignore-existing local/meals; mc mb --ignore-existing local/medical-docs"
    restart: "no"

  migrate:
    build:
      context: ../../backend
      dockerfile: Dockerfile
      target: dev
    env_file:
      - ../../backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-healthos}:${POSTGRES_PASSWORD:-healthos_dev_pass}@postgres:5432/${POSTGRES_DB:-healthos}
      REDIS_URL: redis://:${REDIS_PASSWORD:-healthos_dev_pass}@redis:6379/0
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    command: python -m alembic upgrade head
    restart: "no"

  # ─── Core Backend ─────────────────────────────────────────────────
  core-be:
    <<: *default-logging
    build:
      context: ../../backend
      dockerfile: Dockerfile
      target: dev
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ../../backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-healthos}:${POSTGRES_PASSWORD:-healthos_dev_pass}@postgres:5432/${POSTGRES_DB:-healthos}
      REDIS_URL: redis://:${REDIS_PASSWORD:-healthos_dev_pass}@redis:6379/0
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      AI_WORKER_URL: http://ai-worker:8001
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-healthos_dev_pass}@redis:6379/2
      DEBUG: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
    stop_grace_period: 30s
    volumes:
      - ../../backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ─── Queue Worker (canonical backend task worker) ────────────────
  queue-worker:
    <<: *default-logging
    build:
      context: ../../backend
      dockerfile: Dockerfile
      target: dev
    restart: unless-stopped
    env_file:
      - ../../backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-healthos}:${POSTGRES_PASSWORD:-healthos_dev_pass}@postgres:5432/${POSTGRES_DB:-healthos}
      REDIS_URL: redis://:${REDIS_PASSWORD:-healthos_dev_pass}@redis:6379/0
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-healthos_dev_pass}@redis:6379/2
      AI_WORKER_URL: http://ai-worker:8001
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      DEBUG: "true"
    depends_on:
      redis:
        condition: service_healthy
      core-be:
        condition: service_healthy
      ai-worker:
        condition: service_healthy
    volumes:
      - ../../backend:/app
    command: celery -A app.tasks.celery_app worker --loglevel=info --pool=solo

  # ─── AI Worker ────────────────────────────────────────────────────
  ai-worker:
    <<: *default-logging
    build:
      context: ../../services/ai-worker
      dockerfile: Dockerfile
      target: dev
    restart: unless-stopped
    ports:
      - "8001:8001"
    env_file:
      - ../../services/ai-worker/.env
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:-healthos_dev_pass}@redis:6379/1
      CORE_API_URL: http://core-be:8000
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      DEBUG: "true"
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    volumes:
      - ../../services/ai-worker:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 10

  notification:
    <<: *default-logging
    build:
      context: ../../services/notification
      dockerfile: Dockerfile
      target: dev
    restart: unless-stopped
    ports:
      - "8002:8002"
    env_file:
      - ../../services/notification/.env
    environment:
      CORE_API_URL: http://core-be:8000
      DEBUG: "true"
    depends_on:
      core-be:
        condition: service_healthy
    volumes:
      - ../../services/notification:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8002 --reload
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health').read()"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ─── Frontend + BFF ───────────────────────────────────────────────
  frontend:
    <<: *default-logging
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      target: dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ../../frontend/.env.local
    environment:
      CORE_API_URL: http://core-be:8000
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-dev-nextauth-secret}
      NEXT_PUBLIC_CORE_WS_URL: ws://localhost:8000
    depends_on:
      core-be:
        condition: service_healthy
    volumes:
      - ../../frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    command: npm run dev -- --hostname 0.0.0.0 --port 3000
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10

  # ─── Queue Worker Service (experimental v2 worker) ───────────────
  queue-worker-service:
    profiles: ["experimental-workers"]
    build:
      context: ../../services/queue-worker
      dockerfile: Dockerfile
      target: dev
    restart: unless-stopped
    env_file:
      - ../../services/queue-worker/.env
    environment:
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD:-healthos_dev_pass}@redis:6379/2
      CELERY_RESULT_BACKEND: redis://:${REDIS_PASSWORD:-healthos_dev_pass}@redis:6379/2
      CORE_API_URL: http://core-be:8000
      AI_WORKER_URL: http://ai-worker:8001
      STORAGE_ENDPOINT: http://minio:9000
      DEBUG: "true"
    depends_on:
      redis:
        condition: service_healthy
      core-be:
        condition: service_healthy
      ai-worker:
        condition: service_healthy
      notification:
        condition: service_healthy
    volumes:
      - ../../services/queue-worker:/app
    command: celery -A app.celery_app worker --loglevel=info --pool=solo

volumes:
  postgres_data:
  redis_data:
  minio_data:
  frontend_node_modules:
  frontend_next:

networks:
  default:
    name: healthos_dev_net
