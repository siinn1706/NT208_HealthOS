      parameters:
        - name: conversation_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: message_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Message recalled
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/MessageDTO"

