  # ── WebSocket ─────────────────────────────────────────────────────────────
/ws:
    get:
      tags: [WebSocket]
      summary: Open a persistent WebSocket connection
      description: |
        Connect with a valid short-lived WS ticket obtained via BFF `GET /api/v1/auth/ws-token`
        (which exchanges session for Core `GET /v1/auth/ws-ticket`).

        **Query parameters:**
        - `token` (required): Short-lived JWT ticket (`typ=ws_ticket`)

        **Close codes:**
        - `4001` — JWT invalid or expired (re-fetch token and reconnect)
        - `4403` — Not authorised

        **Client → Server events** (JSON `{"event": "...", "payload": {...}}`):

        | event | description |
        |-------|-------------|
        | `client:hello` | Handshake, sent immediately after open |
        | `pong` | Reply to server `ping` |
        | `conv:join` | Subscribe to room events for a conversation |
        | `msg:send` / `chat.message.send` | Send a message |
        | `msg:edit` / `chat.message.edit` | Edit own message |
        | `msg:delete` / `chat.message.recall` | Recall own message |
        | `msg:react` / `chat.message.react` | Toggle emoji reaction |
        | `msg:pin` | Pin a message |
        | `msg:unpin` | Unpin a message |
        | `msg:read` / `chat.message.read` | Mark conversation as read |
        | `typing` / `chat.typing` | Broadcast typing indicator |
        | `conv:sync` | Request full conversation list refresh |

        **Server → Client events:**

        | event | description |
        |-------|-------------|
        | `ping` | Heartbeat (reply with `pong`) |
        | `user.status` | Online/offline status update |
        | `msg:new` + `chat.message.sent` | New message in a subscribed room |
        | `msg:edit` + `chat.message.edited` | Message was edited |
        | `msg:delete` + `chat.message.recalled` | Message was recalled |
        | `msg:react` + `chat.message.reacted` | Reaction added or removed |
        | `msg:pinned` + `chat.message.pinned` | Message was pinned |
        | `msg:unpinned` + `chat.message.unpinned` | Message was unpinned |
        | `typing` + `chat.typing` | User is/stopped typing |
        | `error` | Event processing error |
      parameters:
        - name: token
          in: query
          required: true
          schema: { type: string }
      responses:
        "101":
          description: Switching Protocols — WebSocket connection established
        "401":
          description: Missing or invalid token

