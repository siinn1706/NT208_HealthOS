  /v1/wearables/google/callback:
    get:
      description: "Exchange the authorization ``code`` for tokens, persist a\n``ConnectedDevice`` row, enqueue an initial\
        \ backfill, and return\nthe device DTO (same shape as ``POST /v1/devices``).\n\nThe route deliberately keeps the response\
        \ 200 (not a redirect): the\nBFF route handler decides whether to redirect the browser back to\n``/dashboard/health``\
        \ — the Core BE just delivers the data.\n\nFailure modes:\n  * Bad state / replay   → 400 (CSRF, expired link, or\
        \ second use).\n  * Bad code             → 400 (Google rejected the exchange).\n  * Token-encrypt fails  → 503 (operator\
        \ forgot ``FERNET_KEY``).\n  * Unique-violation     → handled by ``device_svc`` upsert pattern."
      operationId: google_callback_v1_wearables_google_callback_get
      parameters:
      - in: query
        name: code
        required: true
        schema:
          maxLength: 2048
          minLength: 1
          title: Code
          type: string
      - in: query
        name: state
        required: true
        schema:
          maxLength: 4096
          minLength: 1
          title: State
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectedDeviceResponse'
          description: Successful Response
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Request
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Conflict
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Service Unavailable
      security:
      - bearerAuth: []
      summary: Google Health OAuth callback — finish the connection
      tags:
      - Wearables
  /v1/wearables/google/connect:
    post:
      description: 'Return a fresh Google OAuth consent URL bound to ``current_user``.


        The URL embeds a one-time signed state (``oauth_state.mint_state``)

        so the callback can prove the round-trip was initiated by THIS user

        in THIS browser session.  The nonce is stored in Redis with a 10-minute

        TTL; ``consume_state`` atomically removes it so any replay of the same

        state URL is rejected even before the JWT expires.'
      operationId: google_connect_v1_wearables_google_connect_post
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoogleConnectResponse'
          description: Successful Response
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Service Unavailable
      security:
      - bearerAuth: []
      summary: Begin Google Health OAuth — return consent URL
      tags:
      - Wearables
  /v1/wearables/google/webhook:
    post:
      description: 'Receive a push from Google Health and enqueue an on-demand sync.


        Google Health''s webhook contract is not yet GA (see

        ``google_health.register_webhook`` — it returns ``None``). This

        endpoint is registered now so deployment can flip on push delivery

        later without a code change. Until Google starts calling it, the

        only sync path is the 15-minute Beat poller.


        Auth model: HMAC-SHA256 over the raw body using

        ``settings.google_health_webhook_secret``. NEVER use JWT here —

        Google won''t carry a user JWT.


        Body shape (when Google ships it): we expect a JSON envelope

        carrying the affected Google ``sub`` (the same ``external_account_id``

        we persisted at OAuth time). We look up the matching

        ``ConnectedDevice`` and enqueue ``sync_google_health_user`` for it.'
      operationId: google_webhook_v1_wearables_google_webhook_post
      responses:
        '204':
          description: Successful Response
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Service Unavailable
      security:
      - bearerAuth: []
      summary: Google Health push-notification receiver
      tags:
      - Wearables
