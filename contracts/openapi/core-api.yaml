          - archived
          title: Status
          type: string
        symptoms:
          items:
            $ref: '#/components/schemas/SymptomEntryDTO'
          title: Symptoms
          type: array
        title:
          anyOf:
          - type: string
          - type: 'null'
          title: Title
        updated_at:
          format: date-time
          title: Updated At
          type: string
        user_id:
          format: uuid
          title: User Id
          type: string
        visit_type:
          enum:
          - gp_routine
          - specialist
          - follow_up
          - mental_health
          - urgent_walkin
          - pediatric_caregiver
          title: Visit Type
          type: string
      required:
      - id
      - user_id
      - visit_type
      - status
      - revision
      - created_at
      - updated_at
      title: VisitBriefDetailDTO
      type: object
