openapi: "3.1.0"
info:
  title: HealthOS Core API
  version: "1.0.0"
  description: |
    REST API cho Core Backend Service của HealthOS.
    Base URL: http://localhost:8000
    Tất cả endpoint đặt dưới /v1/

servers:
  - url: http://localhost:8000
    description: Local development
  - url: https://api.healthos.example.com
    description: Production

security:
  - BearerAuth: []

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: NOT_FOUND
            message:
              type: string
              example: Resource not found.
            details:
              type: object

    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
          example: 1
        per_page:
          type: integer
          example: 20
        total:
          type: integer
          example: 100

    HealthCheck:
      type: object
      properties:
        status:
          type: string
          example: ok

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        display_name:
          type: string
        created_at:
          type: string
          format: date-time

    MealCreate:
      type: object
      required: [name]
      properties:
        name:
          type: string
          example: "Phở bò tái"
        notes:
          type: string
        logged_at:
          type: string
          format: date-time

    MealResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        status:
          type: string
          enum: [pending, processing, analyzed, failed]
        nutrition_result:
          $ref: "#/components/schemas/NutritionResult"
        logged_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    NutritionResult:
      type: object
      properties:
        calories:
          type: number
          format: float
        protein_g:
          type: number
          format: float
        carbs_g:
          type: number
          format: float
        fat_g:
          type: number
          format: float
        confidence:
          type: number
          format: float
          minimum: 0
          maximum: 1

    HealthMetric:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        metric_type:
          type: string
          enum: [heart_rate, steps, sleep_minutes, weight_kg, blood_pressure_systolic, blood_pressure_diastolic]
        value:
          type: number
          format: float
        unit:
          type: string
        recorded_at:
          type: string
          format: date-time
        source:
          type: string
          enum: [manual, apple_health, google_fit, garmin, fitbit]

    # ── Chat schemas ────────────────────────────────────────────────────────
    ParticipantDTO:
      type: object
      properties:
        user_id:    { type: string, format: uuid }
        display_name: { type: string }
        avatar_url: { type: string, nullable: true }
        email:      { type: string, format: email }
        is_online:  { type: boolean }
        last_seen:  { type: string, format: date-time, nullable: true }

    MessageReactionGroupDTO:
      type: object
      properties:
        emoji:    { type: string }
        user_ids:
          type: array
          items: { type: string, format: uuid }

    MessageDTO:
      type: object
      properties:
        id:              { type: string, format: uuid }
        conversation_id: { type: string, format: uuid }
        sender_id:       { type: string, format: uuid, nullable: true }
        sender:
          $ref: "#/components/schemas/ParticipantDTO"
          nullable: true
        content:         { type: string }
        content_type:
          type: string
          enum: [text, image, file, audio, system]
        attachments:
          type: array
          items:
            type: object
            properties:
              url:       { type: string, format: uri }
              mime_type: { type: string }
              size:      { type: integer }
              filename:  { type: string }
        reply_to_id: { type: string, format: uuid, nullable: true }
        reply_to:
          type: object
          nullable: true
          properties:
            id:        { type: string, format: uuid }
            content:   { type: string }
            sender_id: { type: string, format: uuid }
        reactions:
          type: array
          items:
            $ref: "#/components/schemas/MessageReactionGroupDTO"
        is_recalled: { type: boolean }
        is_edited:   { type: boolean }
        created_at:  { type: string, format: date-time }
        edited_at:   { type: string, format: date-time, nullable: true }

    LastMessageSummaryDTO:
      type: object
      nullable: true
      properties:
        content:    { type: string }
        sender_id:  { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        type:       { type: string }
        is_recalled: { type: boolean }

    ConversationDTO:
      type: object
      properties:
        id:   { type: string, format: uuid }
        type:
          type: string
          enum: [direct, group, ai]
        name: { type: string, nullable: true, description: "Group name; null for direct / AI" }
        avatar_url: { type: string, nullable: true }
        participants:
          type: array
          items:
            $ref: "#/components/schemas/ParticipantDTO"
        last_message:
          $ref: "#/components/schemas/LastMessageSummaryDTO"
        unread_count:    { type: integer }
        is_accepted:     { type: boolean, description: "False for pending stranger requests" }
        is_muted:        { type: boolean }
        is_pinned:       { type: boolean }
        theme_id:        { type: string, nullable: true }
        updated_at:      { type: string, format: date-time }
        created_at:      { type: string, format: date-time }

paths:
  /health:
    get:
      tags: [System]
      summary: Health check
      security: []
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthCheck"

  # ── Auth ──────────────────────────────────────────────────────────────────
  /v1/auth/login:
    post:
      tags: [Auth]
      summary: Login with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      access_token:
                        type: string
                      token_type:
                        type: string
                        example: bearer
        "400":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/auth/token:
    post:
      tags: [Auth]
      summary: Exchange OAuth profile for access token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider, access_token]
              properties:
                provider:
                  type: string
                  example: google
                access_token:
                  type: string
      responses:
        "200":
          description: OAuth login successful

  /v1/auth/request-otp:
    post:
      tags: [Auth]
      summary: Request email OTP
      description: |
        Generate a 6-digit OTP and send it to the supplied email address.
        - `signup`: always succeeds (creates account on verify).
        - `reset_password`: email must belong to an existing account;
          returns **404 EMAIL_NOT_FOUND** otherwise so FE can redirect to signup.
        Rate-limited to 1 OTP per email+purpose per 60 seconds.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
                  format: email
                purpose:
                  type: string
                  enum: [signup, reset_password, login]
                  default: signup
                name:
                  type: string
                  description: Display name (used for signup; ignored for reset_password)
      responses:
        "200":
          description: OTP sent
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      delivery:
                        type: string
                        example: email
                      expires_in_seconds:
                        type: integer
                        example: 300
                      otp:
                        type: string
                        nullable: true
                        description: "Only present when DEBUG=true"
        "404":
          description: Email not registered (reset_password only)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/auth/verify-otp:
    post:
      tags: [Auth]
      summary: Verify email OTP
      description: |
        - `signup`: verifies OTP, creates/retrieves user, returns JWT.
        - `reset_password`: verifies OTP, stores a short-lived verified marker
          (5 min TTL) in Redis, returns `{ email, next_step: "reset_password" }`.
        Caller must follow up with POST /v1/auth/reset-password.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, code]
              properties:
                email:
                  type: string
                  format: email
                code:
                  type: string
                  minLength: 6
                  maxLength: 6
                  example: "482193"
                  pattern: '^\d{6}$'
                purpose:
                  type: string
                  enum: [signup, reset_password, login]
                  default: signup
      responses:
        "200":
          description: |
            For **signup**: JWT token response.
            For **reset_password**: verified marker response.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    description: signup — JWT issued
                    properties:
                      data:
                        type: object
                        properties:
                          access_token:
                            type: string
                          token_type:
                            type: string
                            example: bearer
                          user_id:
                            type: string
                            format: uuid
                          email:
                            type: string
                            format: email
                          display_name:
                            type: string
                          avatar_url:
                            type: string
                            nullable: true
                  - type: object
                    description: reset_password — OTP verified, proceed to reset
                    properties:
                      data:
                        type: object
                        properties:
                          email:
                            type: string
                            format: email
                          next_step:
                            type: string
                            example: reset_password
        "400":
          description: Invalid or expired OTP
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: User not found (reset_password only)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/auth/reset-password:
    post:
      tags: [Auth]
      summary: Complete password reset
      description: |
        Requires a prior successful POST /v1/auth/verify-otp with
        `purpose=reset_password` (which stores a 5-minute verified marker).
        Updates the user\'s password and returns a JWT access token.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, new_password]
              properties:
                email:
                  type: string
                  format: email
                new_password:
                  type: string
                  minLength: 8
      responses:
        "200":
          description: Password updated, JWT issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      access_token:
                        type: string
                      token_type:
                        type: string
                        example: bearer
                      user_id:
                        type: string
                        format: uuid
                      email:
                        type: string
                        format: email
                      display_name:
                        type: string
                      avatar_url:
                        type: string
                        nullable: true
        "400":
          description: OTP not verified or verification expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Email not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/auth/ws-ticket:
    get:
      tags: [Auth]
      summary: Issue short-lived WebSocket ticket
      description: |
        Returns a short-lived JWT ticket with `typ=ws_ticket`.
        This ticket is intended only for WebSocket `/ws` authentication.
      responses:
        "200":
          description: WS ticket issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      ws_ticket:
                        type: string
                      expires_in_seconds:
                        type: integer
                        example: 120
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /v1/auth/me:
    get:
      tags: [Auth]
      summary: Get current user profile
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
/v1/meals:
    get:
      tags: [Meals]
      summary: List meal logs
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, default: 20 }
        - name: date_from
          in: query
          schema: { type: string, format: date }
        - name: date_to
          in: query
          schema: { type: string, format: date }
      responses:
        "200":
          description: Paginated meal list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/MealResponse"
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"
        "400":
          description: Invalid query params
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      tags: [Meals]
      summary: Create a meal log (with optional image upload)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                notes:
                  type: string
                logged_at:
                  type: string
                  format: date-time
          multipart/form-data:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                notes:
                  type: string
                logged_at:
                  type: string
                  format: date-time
                image:
                  type: string
                  format: binary
      responses:
        "201":
          description: Meal created, analysis enqueued
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/MealResponse"
        "400":
          description: Invalid request body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

/v1/meals/{meal_id}:
    get:
      tags: [Meals]
      summary: Get single meal with nutrition result
      parameters:
        - name: meal_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Meal detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/MealResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

/v1/health-metrics:
    get:
      tags: [Health Metrics]
      summary: List health metrics
      parameters:
        - name: page
          in: query
          schema: { type: integer, default: 1 }
        - name: per_page
          in: query
          schema: { type: integer, default: 20 }
        - name: range
          in: query
          schema:
            type: string
            enum: [7d, 30d, 90d]
        - name: metric_type
          in: query
          schema:
            type: string
            enum: [heart_rate, steps, sleep_minutes, weight_kg, blood_pressure_systolic, blood_pressure_diastolic]
        - name: date_from
          in: query
          schema: { type: string, format: date }
        - name: date_to
          in: query
          schema: { type: string, format: date }
        - name: source
          in: query
          schema:
            type: string
            enum: [manual, apple_health, google_fit, garmin, fitbit]
      responses:
        "200":
          description: Health metrics list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/HealthMetric"
                  meta:
                    $ref: "#/components/schemas/PaginationMeta"
        "400":
          description: Invalid query params
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  # ── Chat ──────────────────────────────────────────────────────────────────
/v1/conversations:
    get:
      tags: [Chat]
      summary: List conversations for the current user
      description: Returns accepted conversations sorted by most recent activity. AI conversation is always first.
      responses:
        "200":
          description: Conversation list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ConversationDTO"
    post:
      tags: [Chat]
      summary: Create a group conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, member_ids]
              properties:
                title:
                  type: string
                  maxLength: 255
                member_ids:
                  type: array
                  items: { type: string, format: uuid }
                  minItems: 2
                avatar_url:
                  type: string
                  format: uri
      responses:
        "201":
          description: Group conversation created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/ConversationDTO"

/v1/conversations/direct:
    post:
      tags: [Chat]
      summary: Create or return an existing direct conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_user_id]
              properties:
                target_user_id:
                  type: string
                  format: uuid
      responses:
        "200":
          description: Existing conversation returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/ConversationDTO"
        "201":
          description: New conversation created (stranger request sent)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/ConversationDTO"

/v1/conversations/pending:
    get:
      tags: [Chat]
      summary: List pending (stranger) conversation requests
      description: Returns conversations where the current user has not yet accepted.
      responses:
        "200":
          description: Pending conversation list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/ConversationDTO"

/v1/conversations/{conversation_id}:
    get:
      tags: [Chat]
      summary: Get a single conversation
      parameters:
        - name: conversation_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Conversation detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/ConversationDTO"
        "403":
          description: Forbidden — caller is not a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      tags: [Chat]
      summary: Update group conversation (title / avatar)
      parameters:
        - name: conversation_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string, maxLength: 255 }
                avatar_url: { type: string, format: uri }
      responses:
        "200":
          description: Updated conversation
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/ConversationDTO"

/v1/conversations/{conversation_id}/accept:
    post:
      tags: [Chat]
      summary: Accept a stranger conversation request
      parameters:
        - name: conversation_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Request accepted

/v1/conversations/{conversation_id}/reject:
    post:
      tags: [Chat]
      summary: Reject a stranger conversation request
      parameters:
        - name: conversation_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Request rejected

/v1/conversations/{conversation_id}/messages:
    get:
      tags: [Chat]
      summary: List messages (cursor pagination — newest first)
      parameters:
        - name: conversation_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: before
          in: query
          description: Return messages before this ISO datetime (exclusive)
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          schema: { type: integer, default: 50, maximum: 100 }
      responses:
        "200":
          description: Message list
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/MessageDTO"
                  has_more:
                    type: boolean
    post:
      tags: [Chat]
      summary: Send a message (REST fallback — prefer WebSocket)
      parameters:
        - name: conversation_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string }
                content_type:
                  type: string
                  enum: [text, image, file, audio, system]
                  default: text
                reply_to_id: { type: string, format: uuid }
                client_message_id: { type: string, maxLength: 128 }
                attachments:
                  type: array
                  items:
                    type: object
                    properties:
                      url: { type: string, format: uri }
                      mime_type: { type: string }
                      size: { type: integer }
                      filename: { type: string }
      responses:
        "201":
          description: Message created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/MessageDTO"

/v1/conversations/{conversation_id}/messages/{message_id}:
    patch:
      tags: [Chat]
      summary: Edit message content (sender only, within 15 min)
      parameters:
        - name: conversation_id
          in: path
          required: true
          schema: { type: string, format: uuid }
        - name: message_id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content: { type: string }
      responses:
        "200":
          description: Edited message
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/MessageDTO"
        "403":
          description: Not the sender or edit window expired
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags: [Chat]
      summary: Recall (soft-delete) a message
      parameters:
        - name: conversation_id
