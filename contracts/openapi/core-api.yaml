      tags:
      - Emergency Card
    post:
      description: "Mint a new QR share token. Plaintext + QR + wallet PDF returned ONCE.\n\nH5 atomicity — the rendering\
        \ pipeline runs BEFORE any DB write so a\nrender failure cannot leave an orphan token row in the database.\nOrder:\n\
        \  1. Preflight (cheap DB read of profile + completeness gate values).\n  2. Generate plaintext + hash + share URL\
        \ (in-memory).\n  3. Render QR (raises on failure → no token written).\n  4. Render wallet PDF (returns None on failure\
        \ → continue without).\n  5. Insert token row + flush.\n  6. Audit (commits the transaction).\n  7. Compose response."
      operationId: mint_emergency_token_v1_users_me_emergency_profile_tokens_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmergencyShareTokenCreateBody'
        required: true
      responses:
        '201':
          content:
            application/json:
