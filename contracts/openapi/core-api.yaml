                emoji: { type: string, description: "Unicode emoji e.g. 👍" }
      responses:
        "200":
          description: Reaction toggled
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: "#/components/schemas/MessageDTO"

  /v1/conversations/{conversation_id}/read:
    post:
      tags: [Chat]
      summary: Mark current user's last read position in a conversation
      parameters:
        - name: conversation_id
          in: path
