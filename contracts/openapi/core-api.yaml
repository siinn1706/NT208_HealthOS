  /health:
    get:
      description: Liveness probe — always 200 while process is running.
      operationId: health_health_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      security:
      - bearerAuth: []
      summary: Health
  /health/ready:
    get:
      description: Readiness probe — 503 if DB or Redis unreachable.
      operationId: health_ready_health_ready_get
      responses:
        '200':
          content:
            application/json:
              schema: {}
          description: Successful Response
      security:
      - bearerAuth: []
      summary: Health Ready
  /v1/admin/overview:
