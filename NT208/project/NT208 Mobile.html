<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>NT208 HealthOS — Mobile Redesign</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css"/>
<style>
  body { background: #EDF3F7; }
  .dc-canvas { background: #EDF3F7; }
  .screen {
    box-shadow: 0 20px 60px -20px rgba(15, 39, 67, 0.35), 0 6px 20px -10px rgba(15, 39, 67, 0.12);
    border-radius: 44px;
    overflow: hidden;
  }
  @keyframes typ {
    0%, 60%, 100% { opacity: 0.25; transform: translateY(0); }
    30% { opacity: 1; transform: translateY(-2px); }
  }
  .dir-label {
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.4px;
    text-transform: uppercase;
    color: #0F2743;
  }
  .dir-sub {
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    font-weight: 500;
    color: #5B90C4;
    margin-top: 2px;
    letter-spacing: 0;
    text-transform: none;
  }
  .intro {
    max-width: 680px;
    padding: 20px 28px;
    background: #fff;
    border-radius: 16px;
    border: 1px solid #DCEFF7;
    font-family: 'Inter', sans-serif;
    color: #0F2743;
  }
  .intro h1 { margin: 0 0 8px; font-size: 22px; letter-spacing: -0.4px; }
  .intro p { margin: 0; font-size: 14px; line-height: 1.55; color: #1A4474; }
  .intro .tags { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .intro .tag {
    padding: 4px 10px; border-radius: 100px; background: #E8F8FD;
    color: #1965B3; font-size: 11px; font-weight: 600;
  }
</style>
</head>
<body>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<div id="root"></div>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="icons.jsx"></script>
<script type="text/babel" src="primitives.jsx"></script>
<script type="text/babel" src="screens-1.jsx"></script>
<script type="text/babel" src="screens-2.jsx"></script>
<script type="text/babel" src="screens-3.jsx"></script>
<script type="text/babel" src="screens-auth.jsx"></script>
<script type="text/babel" src="screens-home-detail.jsx"></script>
<script type="text/babel" src="screens-care.jsx"></script>
<script type="text/babel" src="screens-meds.jsx"></script>
<script type="text/babel" src="screens-forms.jsx"></script>

<script type="text/babel" data-presets="react">
const DCv = window.DesignCanvas;
const DCSec = window.DCSection;
const DCAb = window.DCArtboard;
const Home = window.HomeScreen;
const Apts = window.AppointmentsScreen;
const ChatL = window.ChatScreen;
const ChatC = window.ChatConversationScreen;
const Meds = window.MedicationsScreen;
const Prof = window.ProfileScreen;

// Round 1 · Core App Parity
const R1 = {
  Welcome: window.WelcomeScreen,
  Login: window.LoginScreen,
  Register: window.RegisterScreen,
  Otp: window.OtpScreen,
  Forgot: window.ForgotScreen,
  HealthProfile: window.HealthProfileSetupScreen,
  Permissions: window.PermissionsScreen,
  TodayOverview: window.TodayOverviewScreen,
  HealthScore: window.HealthScoreDetailScreen,
  Vitals: window.VitalsDetailScreen,
  AiInsight: window.AiInsightDetailScreen,
  QuickAction: window.QuickActionSheetScreen,
  AppointmentsRefined: window.AppointmentsRefinedScreen,
  AppointmentDetail: window.AppointmentDetailScreen,
  CreateAppointment: window.CreateAppointmentScreen,
  JoinVideoVisit: window.JoinVideoVisitScreen,
  VisitPrep: window.VisitPrepScreen,
  PrescriptionDetail: window.PrescriptionDetailScreen,
  MedicalHistory: window.MedicalHistoryScreen,
  AttachmentUpload: window.AttachmentUploadScreen,
  MedicationDetail: window.MedicationDetailScreen,
  TakeConfirm: window.TakeMedConfirmScreen,
  MissedDose: window.MissedDoseScreen,
  AddMed: window.AddMedicationScreen,
  EditMed: window.EditMedicationScreen,
  ImportMed: window.ImportMedicationScreen,
  RefillLog: window.RefillLogScreen,
  PauseMed: window.PauseMedScreen,
  ArchiveMed: window.ArchiveMedScreen,
  MedHistory: window.MedicationHistoryScreen,
  FormInputs: window.FormInputsScreen,
  FormPickers: window.FormPickersScreen,
  ConfirmSheet: window.ConfirmSheetScreen,
  Destructive: window.DestructiveDialogScreen,
};

const DIRECTIONS = [
  {
    id: "calm",
    theme: "theme-calm",
    name: "Calm Clinic",
    sub: "Night Sky palette · white cards · clinical-trustworthy",
  },
  {
    id: "night",
    theme: "theme-night",
    name: "Night Sky Dark",
    sub: "Deep navy canvas · glowing cyan accents · calm bedside companion",
  },
  {
    id: "warm",
    theme: "theme-warm",
    name: "Warm Care",
    sub: "Cream + gold/peach · friendlier, wellness-led tone",
  },
];

const SCREENS = [
  { id: "home", label: "Home / Dashboard", Component: Home },
  { id: "apts", label: "Appointments", Component: Apts },
  { id: "chat", label: "Chat list", Component: ChatL },
  { id: "chat-ai", label: "AI conversation", Component: ChatC },
  { id: "meds", label: "Medications", Component: Meds },
  { id: "profile", label: "Profile / Settings", Component: Prof },
];

function App() {
  return (
    <DCv
      title="NT208 HealthOS — Mobile Redesign"
      subtitle="Reimagined for mobile · 3 visual directions × 6 key screens"
    >
      <div style={{ display: "flex", justifyContent: "center", marginBottom: 40 }}>
        <div className="intro">
          <h1>NT208 HealthOS · Mobile</h1>
          <p>
            Redesigned from scratch for mobile — not a shrunken web UI. Information architecture is distilled
            to 5 bottom-tab groups (Home · Care · Chat · Meds · Me), the dashboard leads with a single "Today's health"
            score + 4 KPI rings, appointments uses a week strip with a hero "join video" card, chat pairs the AI
            assistant with human care contacts, medications centers on adherence and today's doses with quick-take
            actions, and Profile puts the Emergency Card one tap away. Three visual directions below — pick one or mix.
          </p>
          <div className="tags">
            <span className="tag">Night Sky palette</span>
            <span className="tag">Inter typography</span>
            <span className="tag">iOS & Android-compatible</span>
            <span className="tag">Dark mode native</span>
            <span className="tag">Accessibility-first</span>
          </div>
        </div>
      </div>

      {DIRECTIONS.map((dir) => (
        <DCSec
          key={dir.id}
          id={dir.id}
          title={dir.name}
          subtitle={dir.sub}
        >
          {SCREENS.map(({ id, label, Component }) => (
            <DCAb
              key={`${dir.id}-${id}`}
              id={`${dir.id}-${id}`}
              label={label}
              width={390}
              height={844}
            >
              <Component theme={dir.theme} />
            </DCAb>
          ))}
        </DCSec>
      ))}

      {/* ══════════════════════════════════════════════
          ROUND 1 · CORE APP PARITY EXPANSION
          ══════════════════════════════════════════════ */}

      <div style={{ display: "flex", justifyContent: "center", margin: "40px 0 24px" }}>
        <div className="intro" style={{ background: "#0F2743", color: "#fff", border: "none" }}>
          <h1 style={{ color: "#fff" }}>Round 1 · Core App Parity Expansion</h1>
          <p style={{ color: "#BFD6EC" }}>
            Extends the existing Calm Clinic / Night Sky system into the flows needed before deeper features:
            Auth &amp; Onboarding, Home drill-downs, the full Care section (appointments, visit prep, prescriptions,
            medical history), core Meds flows (add/edit/import, refill, pause, archive, missed dose, take confirm),
            and reusable form patterns. Tokens are preserved, so lower-priority screens stay dark-mode compatible.
          </p>
          <div className="tags">
            <span className="tag" style={{ background: "#1A4474", color: "#BFD6EC" }}>Auth / Onboarding</span>
            <span className="tag" style={{ background: "#1A4474", color: "#BFD6EC" }}>Home drill-down</span>
            <span className="tag" style={{ background: "#1A4474", color: "#BFD6EC" }}>Care section</span>
            <span className="tag" style={{ background: "#1A4474", color: "#BFD6EC" }}>Meds core flows</span>
            <span className="tag" style={{ background: "#1A4474", color: "#BFD6EC" }}>Form patterns</span>
          </div>
        </div>
      </div>

      <DCSec id="r1-auth-login" title="Auth / Login" subtitle="Welcome · Login · Register · Forgot — light + dark for Login">
        <DCAb id="r1-welcome" label="Welcome" width={390} height={844}><R1.Welcome/></DCAb>
        <DCAb id="r1-login-light" label="Login · Calm Clinic" width={390} height={844}><R1.Login/></DCAb>
        <DCAb id="r1-login-dark" label="Login · Night Sky" width={390} height={844}><R1.Login theme="theme-night"/></DCAb>
        <DCAb id="r1-login-error" label="Login · Error state" width={390} height={844}><R1.Login error/></DCAb>
        <DCAb id="r1-register" label="Register" width={390} height={844}><R1.Register/></DCAb>
        <DCAb id="r1-forgot" label="Forgot password" width={390} height={844}><R1.Forgot/></DCAb>
      </DCSec>

      <DCSec id="r1-auth-otp" title="Auth / OTP & Setup" subtitle="Verification and first-time setup">
        <DCAb id="r1-otp" label="OTP verification" width={390} height={844}><R1.Otp/></DCAb>
        <DCAb id="r1-profile" label="Health profile setup" width={390} height={844}><R1.HealthProfile/></DCAb>
        <DCAb id="r1-perm-notif" label="Permission · Notifications" width={390} height={844}><R1.Permissions kind="notifications"/></DCAb>
        <DCAb id="r1-perm-cam" label="Permission · Camera" width={390} height={844}><R1.Permissions kind="camera"/></DCAb>
        <DCAb id="r1-perm-health" label="Permission · Health data" width={390} height={844}><R1.Permissions kind="health"/></DCAb>
      </DCSec>

      <DCSec id="r1-home-vitals" title="Home / Vitals Detail" subtitle="Drill-downs from the dashboard — light + dark">
        <DCAb id="r1-today" label="Today overview" width={390} height={844}><R1.TodayOverview/></DCAb>
        <DCAb id="r1-vitals-light" label="Vitals trend · Calm Clinic" width={390} height={844}><R1.Vitals/></DCAb>
        <DCAb id="r1-vitals-dark" label="Vitals trend · Night Sky" width={390} height={844}><R1.Vitals theme="theme-night"/></DCAb>
        <DCAb id="r1-quick" label="Quick action sheet" width={390} height={844}><R1.QuickAction/></DCAb>
      </DCSec>

      <DCSec id="r1-home-score" title="Home / Health Score Detail" subtitle="Explanation + AI insight detail">
        <DCAb id="r1-score-light" label="Health score · Calm" width={390} height={844}><R1.HealthScore/></DCAb>
        <DCAb id="r1-score-dark" label="Health score · Night" width={390} height={844}><R1.HealthScore theme="theme-night"/></DCAb>
        <DCAb id="r1-ai-insight" label="AI insight detail" width={390} height={844}><R1.AiInsight/></DCAb>
      </DCSec>

      <DCSec id="r1-care-appt" title="Care / Appointment Detail" subtitle="List · detail · video · visit prep — light + dark">
        <DCAb id="r1-apts-refined" label="Appointments list" width={390} height={844}><R1.AppointmentsRefined/></DCAb>
        <DCAb id="r1-apt-detail-light" label="Appointment detail · Calm" width={390} height={844}><R1.AppointmentDetail/></DCAb>
        <DCAb id="r1-apt-detail-dark" label="Appointment detail · Night" width={390} height={844}><R1.AppointmentDetail theme="theme-night"/></DCAb>
        <DCAb id="r1-join-video" label="Join video visit" width={390} height={844}><R1.JoinVideoVisit/></DCAb>
        <DCAb id="r1-visit-prep" label="Visit prep checklist" width={390} height={844}><R1.VisitPrep/></DCAb>
      </DCSec>

      <DCSec id="r1-care-create" title="Care / Create Appointment" subtitle="Create / edit forms and attachments">
        <DCAb id="r1-apt-create" label="Create appointment" width={390} height={844}><R1.CreateAppointment/></DCAb>
        <DCAb id="r1-attach" label="Attachments & upload" width={390} height={844}><R1.AttachmentUpload/></DCAb>
      </DCSec>

      <DCSec id="r1-care-history" title="Care / Medical History" subtitle="Timeline of visits, labs, prescriptions & diagnoses">
        <DCAb id="r1-history" label="Medical history timeline" width={390} height={844}><R1.MedicalHistory/></DCAb>
        <DCAb id="r1-rx-detail" label="Prescription detail" width={390} height={844}><R1.PrescriptionDetail/></DCAb>
      </DCSec>

      <DCSec id="r1-meds-add" title="Meds / Add Medication" subtitle="Add · Edit · Import">
        <DCAb id="r1-med-add" label="Add medication" width={390} height={844}><R1.AddMed/></DCAb>
        <DCAb id="r1-med-edit" label="Edit medication" width={390} height={844}><R1.EditMed/></DCAb>
        <DCAb id="r1-med-import" label="Import medication" width={390} height={844}><R1.ImportMed/></DCAb>
      </DCSec>

      <DCSec id="r1-meds-detail" title="Meds / Medication Detail" subtitle="Detail, states & dialogs — light + dark">
        <DCAb id="r1-med-detail-light" label="Medication detail · Calm" width={390} height={844}><R1.MedicationDetail/></DCAb>
        <DCAb id="r1-med-detail-dark" label="Medication detail · Night" width={390} height={844}><R1.MedicationDetail theme="theme-night"/></DCAb>
        <DCAb id="r1-med-take" label="Take confirmation" width={390} height={844}><R1.TakeConfirm/></DCAb>
        <DCAb id="r1-med-missed" label="Missed dose" width={390} height={844}><R1.MissedDose/></DCAb>
        <DCAb id="r1-med-pause" label="Pause medication" width={390} height={844}><R1.PauseMed/></DCAb>
        <DCAb id="r1-med-archive" label="Archive medication" width={390} height={844}><R1.ArchiveMed/></DCAb>
      </DCSec>

      <DCSec id="r1-meds-refill" title="Meds / Refill Log" subtitle="Refill history, warnings, and adherence history">
        <DCAb id="r1-med-refill" label="Refill log" width={390} height={844}><R1.RefillLog/></DCAb>
        <DCAb id="r1-med-history" label="Medication history" width={390} height={844}><R1.MedHistory/></DCAb>
      </DCSec>

      <DCSec id="r1-forms" title="Core form patterns" subtitle="Reusable primitives — token-compatible with dark mode">
        <DCAb id="r1-form-inputs" label="Inputs · states" width={390} height={844}><R1.FormInputs/></DCAb>
        <DCAb id="r1-form-pickers" label="Pickers · toggles · radios" width={390} height={844}><R1.FormPickers/></DCAb>
        <DCAb id="r1-confirm-sheet" label="Confirmation sheet" width={390} height={844}><R1.ConfirmSheet/></DCAb>
        <DCAb id="r1-destructive" label="Destructive dialog" width={390} height={844}><R1.Destructive/></DCAb>
      </DCSec>
    </DCv>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>

</body>
</html>
